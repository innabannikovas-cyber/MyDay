<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MyDay</title>
  <meta name="description" content="Личный планировщик — Канбан доска" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyDay" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263144;
      --border: #334155;
      --accent: #6366f1;
      --accent2: #818cf8;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #64748b;
      --red: #ef4444;
      --yellow: #f59e0b;
      --green: #22c55e;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overscroll-behavior: none;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: env(safe-area-inset-top, 0) 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-badge {
      font-size: 13px;
      color: var(--text2);
      background: var(--surface);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .sync-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--surface);
      color: var(--text2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 1px solid var(--border);
      transition: background 0.15s, color 0.15s;
    }
    .sync-btn:hover { background: var(--accent); color: white; }

    /* ── Board layout ── */
    .board-wrap {
      display: flex;
      gap: 12px;
      padding: 16px;
      overflow-x: auto;
      min-height: calc(100vh - 57px);
      align-items: flex-start;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* ── Column ── */
    .column {
      flex: 0 0 280px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 90px);
      transition: outline 0.15s;
    }

    .column.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .col-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .col-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .col-count {
      background: var(--surface2);
      color: var(--text2);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .col-add-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: var(--surface2);
      color: var(--text2);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .col-add-btn:hover { background: var(--accent); color: white; }

    /* ── Cards list ── */
    .cards-list {
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 48px;
    }

    .column.drag-over .cards-list {
      background: rgba(99,102,241,0.06);
      border-radius: var(--radius-sm);
    }

    /* ── Card ── */
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 12px 10px;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s, transform 0.15s, opacity 0.15s;
      position: relative;
    }

    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.3; transform: scale(0.95); }

    .card-priority {
      width: 3px;
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      border-radius: 3px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      padding-left: 8px;
      word-break: break-word;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text2);
      margin-top: 6px;
      padding-left: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-left: 8px;
    }

    .card-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover .card-actions { opacity: 1; }

    .card-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .card-btn:hover { background: var(--border); color: var(--text); }
    .card-btn.del:hover { background: rgba(239,68,68,0.15); color: var(--red); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text3);
      font-size: 13px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 520px;
      padding: 24px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      transform: translateY(40px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--surface2); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-ghost { background: var(--surface2); color: var(--text2); }

    /* ── Sync modal ── */
    .sync-code {
      width: 100%;
      min-height: 100px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--accent2);
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      word-break: break-all;
      resize: none;
    }

    .sync-info {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .sync-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Priority colors ── */
    .p-high   { background: var(--red); }
    .p-medium { background: var(--yellow); }
    .p-low    { background: var(--green); }

    /* ── Tag colors ── */
    .tag-work    { background: rgba(99,102,241,0.2);  color: var(--accent2); }
    .tag-personal{ background: rgba(34,197,94,0.2);   color: #4ade80; }
    .tag-health  { background: rgba(249,115,22,0.2);  color: #fb923c; }
    .tag-home    { background: rgba(20,184,166,0.2);  color: #2dd4bf; }
    .tag-other   { background: rgba(148,163,184,0.2); color: var(--text2); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (min-width: 600px) {
      .board-wrap { padding: 20px 24px; gap: 16px; }
      .column { flex: 0 0 300px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">&#10022;</div>
      MyDay
    </div>
    <div class="header-right">
      <div class="date-badge" id="dateBadge"></div>
      <button class="sync-btn" id="syncBtn" title="&#1057;&#1080;&#1085;&#1093;&#1088;&#1086;&#1085;&#1080;&#1079;&#1072;&#1094;&#1080;&#1103;">&#8645;</button>
    </div>
  </div>
</header>

<main class="board-wrap" id="board"></main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">&#1053;&#1086;&#1074;&#1072;&#1103; &#1079;&#1072;&#1076;&#1072;&#1095;&#1072;</div>
    <form id="cardForm" autocomplete="off">
      <div class="form-group">
        <label>&#1047;&#1072;&#1076;&#1072;&#1095;&#1072; *</label>
        <input type="text" id="fTitle" placeholder="&#1063;&#1090;&#1086; &#1085;&#1091;&#1078;&#1085;&#1086; &#1089;&#1076;&#1077;&#1083;&#1072;&#1090;&#1100;?" maxlength="200" required />
      </div>
      <div class="form-group">
        <label>&#1054;&#1087;&#1080;&#1089;&#1072;&#1085;&#1080;&#1077;</label>
        <textarea id="fDesc" placeholder="&#1044;&#1077;&#1090;&#1072;&#1083;&#1080;, &#1089;&#1089;&#1099;&#1083;&#1082;&#1080;&#8230;" maxlength="500"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>&#1050;&#1086;&#1083;&#1086;&#1085;&#1082;&#1072;</label>
          <select id="fCol">
            <option value="todo">&#1053;&#1072;&#1076;&#1086; &#1089;&#1076;&#1077;&#1083;&#1072;&#1090;&#1100;</option>
            <option value="doing">&#1042; &#1087;&#1088;&#1086;&#1094;&#1077;&#1089;&#1089;&#1077;</option>
            <option value="done">&#1043;&#1086;&#1090;&#1086;&#1074;&#1086;</option>
          </select>
        </div>
        <div class="form-group">
          <label>&#1055;&#1088;&#1080;&#1086;&#1088;&#1080;&#1090;&#1077;&#1090;</label>
          <select id="fPriority">
            <option value="medium">&#1057;&#1088;&#1077;&#1076;&#1085;&#1080;&#1081;</option>
            <option value="high">&#1042;&#1099;&#1089;&#1086;&#1082;&#1080;&#1081;</option>
            <option value="low">&#1053;&#1080;&#1079;&#1082;&#1080;&#1081;</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>&#1058;&#1077;&#1075;</label>
        <select id="fTag">
          <option value="other">&#1041;&#1077;&#1079; &#1090;&#1077;&#1075;&#1072;</option>
          <option value="work">&#1056;&#1072;&#1073;&#1086;&#1090;&#1072;</option>
          <option value="personal">&#1051;&#1080;&#1095;&#1085;&#1086;&#1077;</option>
          <option value="health">&#1047;&#1076;&#1086;&#1088;&#1086;&#1074;&#1100;&#1077;</option>
          <option value="home">&#1044;&#1086;&#1084;</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">&#1054;&#1090;&#1084;&#1077;&#1085;&#1072;</button>
        <button type="submit" class="btn btn-primary" id="modalSave">&#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100;</button>
      </div>
    </form>
  </div>
</div>

<!-- Sync Modal -->
<div class="modal-overlay" id="syncOverlay">
  <div class="modal">
    <div class="modal-title">&#1057;&#1080;&#1085;&#1093;&#1088;&#1086;&#1085;&#1080;&#1079;&#1072;&#1094;&#1080;&#1103;</div>
    <div class="sync-info">
      &#1063;&#1090;&#1086;&#1073;&#1099; &#1087;&#1077;&#1088;&#1077;&#1085;&#1077;&#1089;&#1090;&#1080; &#1079;&#1072;&#1076;&#1072;&#1095;&#1080; &#1085;&#1072; &#1076;&#1088;&#1091;&#1075;&#1086;&#1077; &#1091;&#1089;&#1090;&#1088;&#1086;&#1081;&#1089;&#1090;&#1074;&#1086;:<br/>
      1. &#1053;&#1072;&#1078;&#1084;&#1080; <b>&#171;&#1050;&#1086;&#1087;&#1080;&#1088;&#1086;&#1074;&#1072;&#1090;&#1100;&#187;</b> &#8212; &#1082;&#1086;&#1076; &#1087;&#1086;&#1087;&#1072;&#1076;&#1105;&#1090; &#1074; &#1073;&#1091;&#1092;&#1077;&#1088;<br/>
      2. &#1054;&#1090;&#1087;&#1088;&#1072;&#1074;&#1100; &#1089;&#1077;&#1073;&#1077; &#1074; &#1084;&#1077;&#1089;&#1089;&#1077;&#1085;&#1076;&#1078;&#1077;&#1088;<br/>
      3. &#1053;&#1072; &#1076;&#1088;&#1091;&#1075;&#1086;&#1084; &#1091;&#1089;&#1090;&#1088;&#1086;&#1081;&#1089;&#1090;&#1074;&#1077; &#1074;&#1089;&#1090;&#1072;&#1074;&#1100; &#1082;&#1086;&#1076; &#1080; &#1085;&#1072;&#1078;&#1084;&#1080; <b>&#171;&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1080;&#1090;&#1100;&#187;</b>
    </div>
    <textarea class="sync-code" id="syncCode" placeholder="&#1042;&#1089;&#1090;&#1072;&#1074;&#1100; &#1082;&#1086;&#1076; &#1089;&#1102;&#1076;&#1072; &#1076;&#1083;&#1103; &#1079;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1080;..."></textarea>
    <div class="sync-buttons">
      <button class="btn btn-primary" id="syncCopy">&#1050;&#1086;&#1087;&#1080;&#1088;&#1086;&#1074;&#1072;&#1090;&#1100;</button>
      <button class="btn btn-primary" id="syncLoad" style="background:var(--green)">&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1080;&#1090;&#1100;</button>
      <button class="btn btn-ghost" id="syncClose">&#1047;&#1072;&#1082;&#1088;&#1099;&#1090;&#1100;</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const STORE_KEY = 'myday_board';

const COLUMNS = [
  { id: 'todo',  label: '\u041d\u0430\u0434\u043e \u0441\u0434\u0435\u043b\u0430\u0442\u044c', color: '#6366f1' },
  { id: 'doing', label: '\u0412 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0435',   color: '#f59e0b' },
  { id: 'done',  label: '\u0413\u043e\u0442\u043e\u0432\u043e',       color: '#22c55e' }
];

const TAG_LABELS = {
  work: '\u0420\u0430\u0431\u043e\u0442\u0430', personal: '\u041b\u0438\u0447\u043d\u043e\u0435',
  health: '\u0417\u0434\u043e\u0440\u043e\u0432\u044c\u0435', home: '\u0414\u043e\u043c', other: ''
};

let state = loadState();
let editingId = null;
let dragCardId = null;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && s.cards) return s;
  } catch {}
  return { cards: [] };
}

function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function cardsFor(colId) {
  return state.cards.filter(c => c.col === colId);
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Date badge ────────────────────────────────────────────────────────────
function updateDate() {
  const now = new Date();
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  document.getElementById('dateBadge').textContent =
    now.toLocaleDateString('ru-RU', opts);
}
updateDate();

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach(col => {
    board.appendChild(buildColumn(col));
  });
}

function buildColumn(col) {
  const cards = cardsFor(col.id);
  const wrap = document.createElement('div');
  wrap.className = 'column';
  wrap.dataset.col = col.id;

  wrap.innerHTML = `
    <div class="col-header">
      <div class="col-title">
        <span class="col-dot" style="background:${col.color}"></span>
        ${col.label}
        <span class="col-count">${cards.length}</span>
      </div>
      <button class="col-add-btn" data-col="${col.id}" title="\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0437\u0430\u0434\u0430\u0447\u0443">+</button>
    </div>
    <div class="cards-list" id="list-${col.id}"></div>
  `;

  wrap.querySelector('.col-add-btn').addEventListener('click', () => openModal(null, col.id));

  const list = wrap.querySelector('.cards-list');
  if (cards.length === 0) {
    list.innerHTML = '<div class="empty-state">\u041d\u0435\u0442 \u0437\u0430\u0434\u0430\u0447</div>';
  } else {
    cards.forEach(card => {
      list.appendChild(buildCard(card));
    });
  }

  // Drop zone — entire column
  wrap.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    // Remove highlight from all columns, add to this one
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    wrap.classList.add('drag-over');
  });

  wrap.addEventListener('dragleave', e => {
    if (!wrap.contains(e.relatedTarget)) {
      wrap.classList.remove('drag-over');
    }
  });

  wrap.addEventListener('drop', e => {
    e.preventDefault();
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));

    const cardId = e.dataTransfer.getData('text/plain');
    if (!cardId) return;

    const card = state.cards.find(c => c.id === cardId);
    if (!card) return;

    card.col = col.id;
    saveState();
    render();
  });

  return wrap;
}

function buildCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.id = card.id;

  const tagLabel = TAG_LABELS[card.tag] || '';
  const tagHtml = tagLabel
    ? `<span class="card-tag tag-${card.tag}">${tagLabel}</span>`
    : '<span></span>';

  el.innerHTML = `
    <span class="card-priority p-${card.priority}"></span>
    <div class="card-title">${escHtml(card.title)}</div>
    ${card.desc ? `<div class="card-desc">${escHtml(card.desc)}</div>` : ''}
    <div class="card-footer">
      ${tagHtml}
      <div class="card-actions">
        <button class="card-btn edit" title="\u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c">\u270f\ufe0f</button>
        <button class="card-btn del" title="\u0423\u0434\u0430\u043b\u0438\u0442\u044c">\ud83d\uddd1</button>
      </div>
    </div>
  `;

  el.querySelector('.edit').addEventListener('click', e => {
    e.stopPropagation();
    openModal(card.id);
  });
  el.querySelector('.del').addEventListener('click', e => {
    e.stopPropagation();
    deleteCard(card.id);
  });

  // Desktop drag
  el.addEventListener('dragstart', e => {
    dragCardId = card.id;
    e.dataTransfer.setData('text/plain', card.id);
    e.dataTransfer.effectAllowed = 'move';
    // Use setTimeout so the drag image captures the card before we hide it
    setTimeout(() => el.classList.add('dragging'), 0);
  });

  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    dragCardId = null;
  });

  return el;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(cardId, defaultCol = 'todo') {
  editingId = cardId;
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent =
    cardId ? '\u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0437\u0430\u0434\u0430\u0447\u0443' : '\u041d\u043e\u0432\u0430\u044f \u0437\u0430\u0434\u0430\u0447\u0430';

  if (cardId) {
    const c = state.cards.find(x => x.id === cardId);
    document.getElementById('fTitle').value = c.title;
    document.getElementById('fDesc').value = c.desc || '';
    document.getElementById('fCol').value = c.col;
    document.getElementById('fPriority').value = c.priority;
    document.getElementById('fTag').value = c.tag;
  } else {
    document.getElementById('cardForm').reset();
    document.getElementById('fCol').value = defaultCol;
  }

  overlay.classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 250);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.getElementById('cardForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('fTitle').value.trim();
  if (!title) return;

  const data = {
    title,
    desc: document.getElementById('fDesc').value.trim(),
    col: document.getElementById('fCol').value,
    priority: document.getElementById('fPriority').value,
    tag: document.getElementById('fTag').value
  };

  if (editingId) {
    const idx = state.cards.findIndex(c => c.id === editingId);
    state.cards[idx] = { ...state.cards[idx], ...data };
  } else {
    state.cards.push({ id: uid(), ...data });
  }

  saveState();
  render();
  closeModal();
});

// ── Delete ────────────────────────────────────────────────────────────────
function deleteCard(id) {
  state.cards = state.cards.filter(c => c.id !== id);
  saveState();
  render();
}

// ── Touch drag for mobile ─────────────────────────────────────────────────
let touchCardEl = null;
let touchClone = null;
let touchCardId = null;
let touchTimer = null;

document.addEventListener('touchstart', e => {
  const cardEl = e.target.closest('.card');
  if (!cardEl || e.target.closest('.card-btn')) return;

  touchTimer = setTimeout(() => {
    touchCardEl = cardEl;
    touchCardId = cardEl.dataset.id;
    touchClone = cardEl.cloneNode(true);
    touchClone.style.cssText = `
      position:fixed; z-index:999; opacity:0.85; pointer-events:none;
      width:${cardEl.offsetWidth}px; top:${cardEl.getBoundingClientRect().top}px;
      left:${cardEl.getBoundingClientRect().left}px;
      transform:rotate(2deg); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    `;
    document.body.appendChild(touchClone);
    cardEl.style.opacity = '0.3';
    if (navigator.vibrate) navigator.vibrate(30);
  }, 400);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!touchCardEl) {
    if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
    return;
  }
  e.preventDefault();
  const t = e.touches[0];
  if (touchClone) {
    touchClone.style.top  = (t.clientY - 30) + 'px';
    touchClone.style.left = (t.clientX - 60) + 'px';
  }
  // Highlight target column
  document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const targetCol = el && el.closest('.column');
  if (targetCol) targetCol.classList.add('drag-over');
}, { passive: false });

document.addEventListener('touchend', e => {
  if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
  if (!touchCardEl || !touchCardId) return;

  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const colEl = el && el.closest('.column');

  touchCardEl.style.opacity = '';
  if (touchClone) touchClone.remove();

  if (colEl) {
    const destColId = colEl.dataset.col;
    const card = state.cards.find(c => c.id === touchCardId);
    if (card && destColId) {
      card.col = destColId;
      saveState();
      render();
    }
  }

  document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
  touchCardEl = null;
  touchClone = null;
  touchCardId = null;
});

// ── Sync ──────────────────────────────────────────────────────────────────
document.getElementById('syncBtn').addEventListener('click', () => {
  const overlay = document.getElementById('syncOverlay');
  // Pre-fill with current board data
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  document.getElementById('syncCode').value = code;
  overlay.classList.add('open');
});

document.getElementById('syncClose').addEventListener('click', () => {
  document.getElementById('syncOverlay').classList.remove('open');
});

document.getElementById('syncOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('syncOverlay')) {
    document.getElementById('syncOverlay').classList.remove('open');
  }
});

document.getElementById('syncCopy').addEventListener('click', () => {
  const code = document.getElementById('syncCode').value;
  navigator.clipboard.writeText(code).then(() => {
    showToast('\u041a\u043e\u0434 \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d!');
  }).catch(() => {
    document.getElementById('syncCode').select();
    document.execCommand('copy');
    showToast('\u041a\u043e\u0434 \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d!');
  });
});

document.getElementById('syncLoad').addEventListener('click', () => {
  const code = document.getElementById('syncCode').value.trim();
  if (!code) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (data && data.cards) {
      state = data;
      saveState();
      render();
      document.getElementById('syncOverlay').classList.remove('open');
      showToast('\u0417\u0430\u0434\u0430\u0447\u0438 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u044b!');
    } else {
      showToast('\u041d\u0435\u0432\u0435\u0440\u043d\u044b\u0439 \u043a\u043e\u0434');
    }
  } catch {
    showToast('\u041d\u0435\u0432\u0435\u0440\u043d\u044b\u0439 \u043a\u043e\u0434');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
render();

// Unregister old service worker and register new one
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
